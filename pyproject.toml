[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clocator"
version = "1.0.0"
authors = [
{ name = "Shayne Goldstein" }
]
description = "Pick up your Claude Code conversation history on another computer, matched by git remote."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["claude", "claude-code", "sync", "git", "multi-device", "productivity"]
classifiers = [
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.8",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
"Environment :: Console",
"Intended Audience :: Developers",
"Topic :: Software Development :: Libraries :: Python Modules",
"Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Shayneg-eng/Clocator"
Repository = "https://github.com/Shayneg-eng/Clocator.git"
Issues = "https://github.com/Shayneg-eng/Clocator/issues"
Documentation = "https://github.com/Shayneg-eng/Clocator#readme"

[project.scripts]
clocator = "clocator:main"

